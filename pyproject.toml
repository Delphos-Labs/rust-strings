[build-system]
requires = ["maturin==1.5.1", "cffi"]
build-backend = "maturin"


[project]
name = "rust-strings"
version = "0.7.0"
description = "Streaming ASCII and Unicode UTF-16 string extraction for binary data"
authors = [
    {name = "Delphos Labs"},
]
maintainers = [
    {name = "Delphos Labs"},
]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">=3.7"
keywords = ["strings"]

classifiers = [
    "Topic :: Software Development",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/Delphos-Labs/rust-strings"
Repository = "https://github.com/Delphos-Labs/rust-strings"
Documentation = "https://github.com/Delphos-Labs/rust-strings"

[dev-dependencies]
pytest = "^7.2.0"

[tool.maturin]
profile = "release"
features = ["python_bindings"]
